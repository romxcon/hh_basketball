name: Update calendar

on:
  schedule:
    - cron: "0 12 * * *"   # daily at 12:00 UTC (6-7 AM Central)
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - run: python update_calendar.py
        continue-on-error: true   # one team failing shouldn't block the other's update

      - name: Commit if the schedule changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add '*.ics'
          git diff --cached --quiet || (git commit -m "Update schedule" && git push)
